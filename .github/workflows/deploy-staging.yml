name: Deploy staging

on:
  # Deploy only after the CI workflow has passed on the exact commit, so a
  # failing push can never reach staging. Manual dispatch bypasses the gate
  # by design.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the commit CI verified
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch runs workflow_run is absent; fall back to
          # the ref the dispatch targeted.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and worker bundle
        run: pnpm build

      - name: Apply staging D1 migrations
        run: pnpm db:migrate:staging

      - name: Deploy staging Worker
        run: pnpm deploy:staging
